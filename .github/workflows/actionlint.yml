name: Actionlint

on:
  pull_request:
    branches: ["**"]
  push:
    branches: ["master"]

permissions:
  contents: read

jobs:
  # Detect which files changed to conditionally run actionlint
  changes:
    name: Detect Changes
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: read
    outputs:
      workflows: ${{ steps.filter.outputs.workflows }}
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check for file changes
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            workflows:
              - '.github/workflows/**'

  actionlint:
    needs: changes
    if: needs.changes.outputs.workflows == 'true'
    name: Lint GitHub Actions Workflows
    runs-on: ubuntu-24.04

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run actionlint
        id: actionlint
        uses: raven-actions/actionlint@3d39aea434753780c3b3d4a1a31c854b4dbf49d7 # v2.2.0
        with:
          matcher: true
          cache: true
          fail-on-error: true

      - name: Actionlint Summary
        if: always() && steps.actionlint.outputs.exit-code != '0'
        run: |
          {
            echo "### ❌ Actionlint Results"
            echo ""
            echo "**Version:** ${{ steps.actionlint.outputs.version-semver }}"
            echo "**Release:** ${{ steps.actionlint.outputs.version-tag }}"
            echo "**Exit Code:** ${{ steps.actionlint.outputs.exit-code }}"
            echo "**Exit Message:** ${{ steps.actionlint.outputs.exit-message }}"
            echo "**Total Errors:** ${{ steps.actionlint.outputs.total-errors }}"
            echo "**Files Checked:** ${{ steps.actionlint.outputs.total-files }}"
            echo "**Cache Hit:** ${{ steps.actionlint.outputs.cache-hit }}"
          } >> "$GITHUB_STEP_SUMMARY"
          exit 1

      - name: Success Summary
        if: steps.actionlint.outputs.exit-code == '0'
        run: |
          {
            echo "### ✅ Actionlint Passed"
            echo ""
            echo "All workflow files are valid!"
            echo ""
            echo "**Files Checked:** ${{ steps.actionlint.outputs.total-files }}"
            echo "**Version:** ${{ steps.actionlint.outputs.version-semver }}"
          } >> "$GITHUB_STEP_SUMMARY"
