name: Fuzzing with ClusterFuzzLite

on:
  # Run fuzzing on a schedule (weekly)
  schedule:
    - cron: "0 2 * * 1" # Every Monday at 2 AM UTC
  workflow_dispatch: # Allow manual triggering

permissions:
  contents: read
  issues: write # For filing issues on findings
  security-events: write # For uploading SARIF results

jobs:
  # Extended fuzzing run (30 minutes), weekly and on demand only
  fuzz-extended-address:
    name: Fuzzing (Extended)
    runs-on: ubuntu-26.04
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26"

      - name: Install npm 11.19.1
        shell: bash
        run: npm install -g npm@11.19.1

      - name: Install Dependencies
        run: npm ci

      - name: Run property-based fuzzing tests (extended)
        run: npm run test:fuzz
        timeout-minutes: 30
        env:
          # Increase number of runs for extended fuzzing
          FUZZ_RUNS: "5000"

      - name: Upload fuzzing results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-results-node24-address
          path: .fuzz-results/
          if-no-files-found: ignore
          retention-days: 30

  # Continuous fuzzing summary
  fuzz-summary:
    name: Fuzzing Summary
    if: always()
    needs: [fuzz-extended-address]
    runs-on: ubuntu-26.04

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Create fuzzing summary
        run: |
          {
            echo "# Fuzzing Summary"
            echo ""
            echo "Fuzzing completed for commit ${{ github.sha }}"
            echo ""
            echo "## Fuzz Test Components"
            echo "- Tag Parser (parseTagInput)"
            echo "- Tag Validation (validateTag)"
            echo "- Schema Loader (translation methods)"
            echo ""
            echo "## Coverage"
            echo "Property-based testing with fast-check library"
            echo ""
            echo "See artifacts for detailed results."
          } >> "$GITHUB_STEP_SUMMARY"
