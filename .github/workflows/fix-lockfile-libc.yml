name: Fix Lockfile libc

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: read

jobs:
  fix-lockfile-libc:
    name: Fix Lockfile libc
    # Skip fork PRs — artifacts from forks won't trigger the commit workflow
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-26.04

    steps:
      - name: Harden the runner (Block unexpected egress)
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: block
          allowed-endpoints: >
            github.com:443

      - name: Checkout PR code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1

      - name: Remove libc entries from package-lock.json
        run: |
          node - package-lock.json <<'SCRIPT'
          const fs = require("node:fs");
          const lockfilePath = process.argv[2];
          const lock = JSON.parse(fs.readFileSync(lockfilePath, "utf8"));
          let removed = 0;
          for (const pkg of Object.values(lock.packages ?? {})) {
            if (Object.prototype.hasOwnProperty.call(pkg, "libc")) {
              delete pkg.libc;
              removed++;
            }
          }
          if (removed > 0) {
            fs.writeFileSync(lockfilePath, `${JSON.stringify(lock, null, 2)}\n`);
            console.log(`Removed "libc" from ${removed} package(s)`);
          } else {
            console.log('No "libc" entries found — nothing to do');
          }
          SCRIPT

      - name: Save PR number for commit workflow
        env:
          PR_NUMBER: ${{ github.event.number }}
        run: echo "$PR_NUMBER" > pr_number.txt

      - name: Upload lockfile fix artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lockfile-fix
          path: |
            package-lock.json
            pr_number.txt
          retention-days: 1
